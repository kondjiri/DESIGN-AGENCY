<h2 mat-dialog-title class="text-center text-dark">LOGIN</h2>
<form [formGroup]="editForm" (ngSubmit)="login()">
  <mat-dialog-content class="mat-typography py-4">
      <mat-form-field class="container-fluid" appearance="outline">
        <mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <span class="mx-1">Email</span>
        </mat-label>
        <input matInput type="email" id="email" class="text-dark" formControlName="email" name="email">
      </mat-form-field>
      <mat-form-field class="container-fluid" appearance="outline">
        <mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <span class="mx-1">Password</span>
        </mat-label>
        <input matInput [type]="!hide?'password':'text'" id="password" class="text-dark" formControlName="password" name="password">
        <button mat-icon-button type="button" matSuffix (click)="hide=!hide" class="text-dark">
          <mat-icon>{{hide?'visibility':'visibility_off'}}</mat-icon>
        </button>
      </mat-form-field>
      <div class="d-flex justify-content-end container-fluid">
        <button class="rounded-4 text-dark border-0" style="margin-left: 20px;" (click)="openSignUpDialog()" mat-stroked-button>Créer un nouveau compte ?</button>
      </div>
  </mat-dialog-content>
  <mat-dialog-actions align="start">
        <div class="container-fluid">
          <button mat-button mat-dialog-close [mat-dialog-close]="true" style="background-color: rgba(255,0,0,0.9) !important;backdrop-filter: blur(4px);" class="rounded-4 main-btn text-white bg-danger border-0" type="button" (click)="closeDialog()">CANCEL</button>
          <button [disabled]="editForm.invalid" mat-button style="background-color: rgb(0,0,0) !important;backdrop-filter: blur(4px);" class="rounded-4 main-btn text-white border-0" type="submit" color="primary" cdkFocusInitial>VALIDER</button>
        </div>
  </mat-dialog-actions>
</form>
