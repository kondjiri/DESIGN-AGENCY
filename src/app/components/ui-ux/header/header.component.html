<div class="container-fluid p-0 m-0  position-fixed" style="z-index: 1000;">
    <div class="row d-flex justify-content-center align-items-center shadow">
        <div
          class="col-lg-10 col-md-11 col-sm-12 col-12 d-flex mt-2 justify-content-between  align-items-center" style="height: 55px;backdrop-filter: blur(5px)">
            <div class="">
              <button routerLink="/home" class="rounded-pill border-0 text-dark" mat-stroked-button>
                <img src="assets/icons/faaro-logo.png" style="width: 100px;height: auto" alt="">
              </button>
            </div>
            <div class="mobile">
              <button class="main-btn text-dark border-0" [matMenuTriggerFor]="mobileMenu"  mat-stroked-button><mat-icon>menu</mat-icon></button>
              <mat-menu class="ressources" #mobileMenu="matMenu" yPosition="below">
                        <a class="main-btn text-dark border-0" mat-menu-item routerLink="/home">Home</a>
                        <button class="main-btn text-dark border-0" mat-menu-item [matMenuTriggerFor]="produits">Products</button>
                        <mat-menu class="produits" #produits="matMenu" yPosition="below">
                          <button mat-menu-item routerLink="/products/angular" class="text-dark main-btn">
                            <img src="assets/icons/angular.png" style="width: 25px;margin-right:10px;height: auto" alt="">Angular JS
                          </button>
                          <button mat-menu-item routerLink="/products/reactjs" class="text-dark main-btn">
                            <img src="assets/icons/reactjs.png" style="width: 25px;margin-right:10px;height: auto" alt="">React Js
                          </button>
                          <button mat-menu-item routerLink="/products/html-css-bootstrap" class="text-dark main-btn">
                            <img src="assets/icons/html_css_bootstrap.png" style="width: 25px;margin-right:10px;height: auto" alt="">HTML & CSS & Bootstrap
                          </button>
                          <button mat-menu-item routerLink="/products/symphony" class="text-dark main-btn">
                            <img src="assets/icons/symphony.png" style="width: 25px;margin-right:10px;height: auto" alt="">Symphony
                          </button>
                          <button mat-menu-item routerLink="/products/laravel" class="text-dark main-btn">
                            <img src="assets/icons/laravel.png" style="width: 25px;margin-right:10px;height: auto" alt="">Laravel PHP
                          </button>

                          <button mat-menu-item routerLink="/products/photoshop" class="text-dark main-btn">
                            <img src="assets/icons/photoshop.png" style="width: 25px;margin-right:10px;height: auto" alt="">Photoshop
                          </button>
                          <button mat-menu-item routerLink="/products/illustrator" class="text-dark main-btn">
                            <img src="assets/icons/illustrator.png" style="width: 25px;margin-right:10px;height: auto" alt="">Illustrator
                          </button>
                          <button mat-menu-item routerLink="/products/premiere-pro" class="text-dark main-btn">
                            <img src="assets/icons/premiere_pro.png" style="width: 25px;margin-right:10px;height: auto" alt="">Premiere Pro
                          </button>
                          <button mat-menu-item routerLink="/products/after-effect" class="text-dark main-btn">
                            <img src="assets/icons/after_effect.png" style="width: 25px;margin-right:10px;height: auto" alt="">After Effect
                          </button>
                          <button mat-menu-item routerLink="/products" class="text-dark text-center main-btn">
                            Tout afficher
                          </button>

                        </mat-menu>
                        <button class="main-btn text-dark border-0" mat-menu-item [matMenuTriggerFor]="ressources">Ressources</button>
                        <mat-menu class="ressources" #ressources="matMenu" yPosition="below">
                          <button mat-menu-item routerLink="/ressources/icons" class="text-dark main-btn">
                            <img src="assets/icons/little_logo.svg" style="width: 30px;height: auto" alt=""> <span class="ms-2">Icons</span>
                          </button>
                          <button mat-menu-item class="text-dark main-btn">
                            <img src="assets/icons/abonnement-tv.png" style="width: 30px;height: auto" alt=""><span class="ms-2">Blog</span>
                          </button>
                          <button mat-menu-item class="text-dark main-btn">
                            <img src="assets/icons/infos.png" style="width: 30px;height: auto" alt=""><span class="ms-2">Learing</span>
                          </button>
                        </mat-menu>
<!--                        <a class="main-btn text-white border-0" mat-menu-item routerLink="/">Pricing</a>-->
                        <button class="main-btn text-dark border-0" color="primary" (click)="openConnexionDialog()" style="background-color: rgba(75, 82, 106, 0.4) !important;backdrop-filter: blur(4px);" mat-menu-item>Log in</button>
              </mat-menu>
            </div>
            <div class="desktop">
                <a class="mx-3 rounded-4 main-btn text-dark border-0" mat-stroked-button routerLink="/home">Home</a>
                <button class="rounded-4 main-btn text-dark border-0" mat-stroked-button [matMenuTriggerFor]="produits">Products <mat-icon>expand_more</mat-icon></button>
                <button class="rounded-4 main-btn text-dark border-0" mat-stroked-button [matMenuTriggerFor]="ressources">Ressources <mat-icon>expand_more</mat-icon></button>
<!--                <a class="mx-3 rounded-4 main-btn text-white border-0" mat-stroked-button routerLink="/">Pricing</a>-->
                <button (click)="openConnexionDialog()" class="rounded-4 main-btn text-white border-0" color="primary" style="margin-left: 20px;background-color: rgb(0,0,0) !important;backdrop-filter: blur(4px);" mat-stroked-button>Log In</button>
            </div>
        </div>
    </div>
</div>
